name: Feature request
description: Suggest a detector, integration, or API improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should pii-safe help with?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to add or change?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Use fake values only. Do not include real PII or secrets.
      render: ts
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core API
        - Detector
        - Logger integration
        - LLM helper
        - Documentation
        - Packaging
        - Other
